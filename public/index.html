<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau de bord — Agent IA vocal</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #22262f;
    --text: #e7e9ee;
    --muted: #8a90a0;
    --accent: #6c8cff;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  main { padding: 24px 32px; max-width: 900px; margin: 0 auto; }
  .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 140px;
  }
  .stat .value { font-size: 28px; font-weight: 600; }
  .stat .label { color: var(--muted); font-size: 13px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }
  .badge {
    display: inline-block;
    background: rgba(74, 222, 128, 0.12);
    color: var(--ok);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>📞 Tableau de bord — Agent IA vocal</h1>
  <p>Rendez-vous pris automatiquement par téléphone</p>
</header>
<main>
  <div class="stats">
    <div class="stat">
      <div class="value" id="statTotal">–</div>
      <div class="label">Rendez-vous au total</div>
    </div>
    <div class="stat">
      <div class="value" id="statToday">–</div>
      <div class="label">Aujourd'hui</div>
    </div>
  </div>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>Client</th>
        <th>Téléphone</th>
        <th>Motif</th>
        <th>Date &amp; heure</th>
        <th>Calendrier</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty">Aucun rendez-vous pour le moment. Les appels réservés apparaîtront ici automatiquement.</div>
</main>

<script>
  async function load() {
    const res = await fetch("/api/appointments");
    const data = await res.json();

    document.getElementById("statTotal").textContent = data.length;
    const todayStr = new Date().toDateString();
    const today = data.filter(a => new Date(a.startTime).toDateString() === todayStr);
    document.getElementById("statToday").textContent = today.length;

    const tbody = document.getElementById("tbody");
    const table = document.getElementById("table");
    const empty = document.getElementById("empty");

    if (data.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }

    table.style.display = "table";
    empty.style.display = "none";
    tbody.innerHTML = data.map(a => `
      <tr>
        <td>${escapeHtml(a.customerName || "—")}</td>
        <td>${escapeHtml(a.customerPhone || "—")}</td>
        <td>${escapeHtml(a.reason || "—")}</td>
        <td>${formatDate(a.startTime)}</td>
        <td>${a.calendarLink ? `<a class="link" href="${a.calendarLink}" target="_blank">Voir <span class="badge">Google Calendar</span></a>` : "—"}</td>
      </tr>
    `).join("");
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  load();
  setInterval(load, 15000); // rafraîchit toutes les 15s
</script>
</body>
</html>
